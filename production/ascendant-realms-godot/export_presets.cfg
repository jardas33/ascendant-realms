html/head_include="<script>(function(){
var PARENT='*';
var consoleBuf=[];
var MAX_LOG=100;
var origLog=console.log,origWarn=console.warn,origErr=console.error;
function pushLog(level,args){
  var msg;
  try{msg=Array.prototype.map.call(args,function(a){
    return typeof a==='object'?JSON.stringify(a):String(a);
  }).join(' ');}catch(e){msg=String(args[0]||'');}
  consoleBuf.push({level:level,message:msg,ts:Date.now()});
  if(consoleBuf.length>MAX_LOG)consoleBuf.shift();
}
console.log=function(){pushLog('log',arguments);origLog.apply(console,arguments);};
console.warn=function(){pushLog('warn',arguments);origWarn.apply(console,arguments);};
console.error=function(){pushLog('error',arguments);origErr.apply(console,arguments);
  queueError('console.error',Array.prototype.join.call(arguments,' '));};

var errBatch=[];
var errTimer=null;
function queueError(type,message,filename,lineno,stack){
  errBatch.push({errorType:type,message:message||'Unknown error',filename:filename||'',lineno:lineno||0,stack:stack||''});
  if(!errTimer){
    errTimer=setTimeout(function(){
      var batch=errBatch;errBatch=[];errTimer=null;
      var combined=batch.map(function(e){return e.message}).join(String.fromCharCode(10));
      try{window.parent.postMessage({
        type:'game-error',errorType:batch[0].errorType,message:combined,
        filename:batch[0].filename,lineno:batch[0].lineno,stack:batch[0].stack,
        errors:batch
      },PARENT);}catch(e){}
    },200);
  }
}

window.onerror=function(msg,src,line,col,err){
  queueError('runtime',String(msg),src,line,err?err.stack:'');
};
window.addEventListener('unhandledrejection',function(ev){
  var r=ev.reason;
  queueError('unhandledrejection',r?r.message||String(r):'Promise rejected','',0,r?r.stack:'');
});

if(typeof Module!=='undefined'){
  var origPrintErr=Module.printErr;
  Module.printErr=function(){
    pushLog('error',arguments);
    queueError('godot',Array.prototype.join.call(arguments,' '));
    if(origPrintErr)origPrintErr.apply(Module,arguments);
  };
}

var muted=false;
try{muted=new URLSearchParams(window.location.search).get('muted')==='1';}catch(e){}
var trackedAudioContexts=[];
function applyMutedToMediaElement(el){
  if(!el)return;
  try{
    if(muted){
      if(!el.__studioMuteManaged){
        el.__studioPrevMuted=!!el.muted;
        el.__studioPrevDefaultMuted=!!el.defaultMuted;
        el.__studioMuteManaged=true;
      }
      el.muted=true;
      el.defaultMuted=true;
    }else if(el.__studioMuteManaged){
      el.muted=!!el.__studioPrevMuted;
      el.defaultMuted=!!el.__studioPrevDefaultMuted;
      el.__studioMuteManaged=false;
    }
  }catch(e){}
}
function applyMutedState(){
  try{
    Array.prototype.forEach.call(document.querySelectorAll('audio,video'),applyMutedToMediaElement);
  }catch(e){}
  trackedAudioContexts=trackedAudioContexts.filter(function(ctx){
    return !!ctx&&ctx.state!=='closed';
  });
  trackedAudioContexts.forEach(function(ctx){
    try{
      if(muted){
        if(ctx.state==='running'){
          ctx.__studioMutedByParent=true;
          ctx.suspend();
        }
      }else if(ctx.__studioMutedByParent){
        ctx.__studioMutedByParent=false;
        ctx.resume();
      }
    }catch(e){}
  });
}
function trackAudioContext(ctx){
  if(!ctx)return ctx;
  trackedAudioContexts.push(ctx);
  // Defense-in-depth: if anything ever flips this context to 'running'
  // while we're meant to be muted (e.g. a future Godot runtime that
  // bypasses .resume(), or a custom autoplay-policy workaround inside
  // the game), re-suspend it immediately. Pairs with the .resume()
  // prototype wrap below — that one prevents the transition entirely
  // for the common Godot path; this one catches anything that slips
  // past.
  if(typeof ctx.addEventListener==='function'){
    try{
      ctx.addEventListener('statechange',function(){
        if(muted&&ctx.state==='running'){
          try{
            ctx.__studioMutedByParent=true;
            ctx.suspend();
          }catch(e){}
        }
      });
    }catch(e){}
  }
  if(muted&&ctx.state==='running'){
    try{
      ctx.__studioMutedByParent=true;
      ctx.suspend();
    }catch(e){}
  }
  return ctx;
}
function wrapAudioContextConstructor(name){
  var NativeCtor=window[name];
  if(typeof NativeCtor!=='function')return;
  var WrappedCtor=function(){
    var args=Array.prototype.slice.call(arguments);
    var ctx=Reflect.construct(NativeCtor,args,WrappedCtor);
    return trackAudioContext(ctx);
  };
  WrappedCtor.prototype=NativeCtor.prototype;
  try{Object.setPrototypeOf(WrappedCtor,NativeCtor);}catch(e){}
  Object.getOwnPropertyNames(NativeCtor).forEach(function(key){
    if(key==='prototype')return;
    try{WrappedCtor[key]=NativeCtor[key];}catch(e){}
  });
  window[name]=WrappedCtor;
}
// Intercept ``AudioContext.prototype.resume`` so Godot's HTML5 export
// shell can't unilaterally un-mute the game on first user gesture.
//
// Why this matters: Godot's web runtime ships a standard browser-
// autoplay-policy workaround that calls ``audioContext.resume()`` on
// the first mouse / key / touch event inside the canvas. From its POV
// the context was suspended for autoplay reasons and needs lifting.
// From OUR POV we suspended it because the parent set ``muted=true``,
// and Godot's resume call would un-mute the game even though our
// ``muted`` flag (and the parent's mute button) still says muted.
//
// The fix: when ``muted=true``, intercept ``.resume()``, leave the
// context suspended, and tag it with ``__studioMutedByParent=true`` so
// the next unmute (which calls ``ctx.resume()`` from
// ``applyMutedState``) restores it cleanly. Returns a resolved Promise
// so callers awaiting the resume don't hang.
function wrapResumePrototype(name){
  var Ctor=window[name];
  if(!Ctor||!Ctor.prototype)return;
  var origResume=Ctor.prototype.resume;
  if(typeof origResume!=='function')return;
  Ctor.prototype.resume=function(){
    if(muted){
      try{this.__studioMutedByParent=true;}catch(e){}
      return Promise.resolve();
    }
    return origResume.apply(this,arguments);
  };
}
if(window.HTMLMediaElement&&window.HTMLMediaElement.prototype){
  var origPlay=window.HTMLMediaElement.prototype.play;
  if(typeof origPlay==='function'){
    window.HTMLMediaElement.prototype.play=function(){
      applyMutedToMediaElement(this);
      return origPlay.apply(this,arguments);
    };
  }
}
wrapAudioContextConstructor('AudioContext');
wrapAudioContextConstructor('webkitAudioContext');
wrapResumePrototype('AudioContext');
// Safari uses ``webkitAudioContext`` with a separate constructor whose
// prototype may NOT be shared with ``AudioContext`` — wrap it too.
wrapResumePrototype('webkitAudioContext');
applyMutedState();

var activeRecorder=null;
window.addEventListener('message',function(ev){
  var d=ev.data;
  if(!d||!d.type)return;

  if(d.type==='capture-screenshot'){
    try{
      var c=document.getElementById('canvas');
      if(c){
        var url=c.toDataURL('image/jpeg',0.8);
        window.parent.postMessage({type:'screenshot-result',dataUrl:url},PARENT);
      }else{window.parent.postMessage({type:'screenshot-result',dataUrl:null},PARENT);}
    }catch(e){window.parent.postMessage({type:'screenshot-result',dataUrl:null},PARENT);}
  }

  else if(d.type==='get-console-logs'){
    window.parent.postMessage({type:'console-logs-result',logs:consoleBuf.slice()},PARENT);
  }

  else if(d.type==='set-muted'){
    muted=!!d.muted;
    applyMutedState();
  }

  else if(d.type==='start-recording'){
    try{
      var c=document.getElementById('canvas');
      if(!c||!c.captureStream){window.parent.postMessage({type:'recording-result',video:null,error:'captureStream not supported'},PARENT);return;}
      if(activeRecorder){try{activeRecorder.stop();}catch(e){} activeRecorder=null;}
      var dur=d.duration||5000;
      var fps=d.fps||10;
      var stream=c.captureStream(fps);
      var mimeType='video/webm;codecs=vp8';
      if(!MediaRecorder.isTypeSupported(mimeType))mimeType='video/webm';
      var recorder=new MediaRecorder(stream,{mimeType:mimeType});
      var chunks=[];
      recorder.ondataavailable=function(e){if(e.data&&e.data.size>0)chunks.push(e.data);};
      recorder.onstop=function(){
        activeRecorder=null;
        if(chunks.length===0){window.parent.postMessage({type:'recording-result',video:null,error:'no data'},PARENT);return;}
        var blob=new Blob(chunks,{type:mimeType});
        var reader=new FileReader();
        reader.onload=function(){
          var buf=reader.result;
          window.parent.postMessage({type:'recording-result',video:buf,mimeType:mimeType},PARENT,[buf]);
        };
        reader.readAsArrayBuffer(blob);
      };
      recorder.onerror=function(e){
        activeRecorder=null;
        window.parent.postMessage({type:'recording-result',video:null,error:String(e.error||'recorder error')},PARENT);
      };
      activeRecorder=recorder;
      recorder.start();
      setTimeout(function(){if(activeRecorder===recorder){try{recorder.stop();}catch(e){}}},dur);
    }catch(e){window.parent.postMessage({type:'recording-result',video:null,error:String(e)},PARENT);}
  }

  else if(d.type==='stop-recording'){
    if(activeRecorder){try{activeRecorder.stop();}catch(e){} activeRecorder=null;}
  }

  else if(d.type==='get-activity-status'){
    window.parent.postMessage({type:'activity-status-result',lastActivity:lastActivity},PARENT);
  }
});

var lastActivity=Date.now();
var inputThrottled=false;
['keydown','mousemove','mousedown','touchstart','touchmove','pointerdown'].forEach(function(evt){
  document.addEventListener(evt,function(){
    lastActivity=Date.now();
    if(!inputThrottled){
      inputThrottled=true;
      try{window.parent.postMessage({type:'game-input',ts:lastActivity},PARENT);}catch(e){}
      setTimeout(function(){inputThrottled=false;},500);
    }
  },{passive:true});
});

})();</script><script>(function(){var obs=new MutationObserver(function(mutations){for(var i=0;i<mutations.length;i++){var removed=mutations[i].removedNodes;for(var j=0;j<removed.length;j++){if(removed[j].id==='status'){obs.disconnect();var wm=document.getElementById('tesana-watermark');if(wm)wm.style.display='flex';var c=document.getElementById('canvas');if(c)c.focus();return;}}}});obs.observe(document.body||document.documentElement,{childList:true,subtree:true});})();</script><style>#status{background:#000!important}#status-splash{display:none!important}#status::before{content:'';display:block;width:320px;height:80px;background:url('data:image/png;base64,')no-repeat center/contain}#status-progress::-webkit-progress-bar{background:#222}#status-progress::-webkit-progress-value{background:#fff}#status-progress::-moz-progress-bar{background:#fff}#status-size{color:#aaa;font-family:'Noto Sans','Droid Sans',Arial,sans-serif;font-size:13px;text-align:center;letter-spacing:0.5px;position:absolute;left:0;right:0;bottom:calc(10% + 28px)}</style><style>#tesana-watermark{display:none;justify-content:flex-end;align-items:flex-end;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9998;pointer-events:none;}#tesana-watermark-inner{position:relative;width:100vw;height:56.25vw;max-width:100vw;max-height:100vh;aspect-ratio:16/9;margin:auto;display:flex;justify-content:flex-end;align-items:flex-end;}#tesana-watermark img{width:13%;height:auto;display:block;margin-bottom:1.5%;margin-right:2.25%;}@media (max-aspect-ratio: 16/9) {#tesana-watermark-inner{width:100vw;height:auto;max-height:100vh;}}@media (min-aspect-ratio: 16/9) {#tesana-watermark-inner{height:100vh;width:auto;max-width:100vw;}}</style><div id='tesana-watermark'>  <div id='tesana-watermark-inner'>    <img src='data:image/png;base64,' alt='Tesana'/>  </div></div>"
